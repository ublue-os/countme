name: CountMe Update
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  update-countme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Get current date
        id: date
        run: echo "::set-output name=date::$(date +'%Y-%m-%d')"

      - name: Cache CountMe dataset
        id: cache-totals
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: totals.csv
          key: totals-csv-${{ steps.date.outputs.date }}

      - name: Get Count
        run: ./graph.sh ${{ steps.cache-totals.outputs.cache-hit != 'true' && '-d' || '' }}
        working-directory: ${{ github.workspace }}

      - name: Write Growth Charts to Repostiory
        uses: test-room-7/action-update-file@6b8249d09d5926fbae288c0bb640757f09ec7ce0 # v2
        with:
            file-path: |
              growth_aurora.svg
              growth_bluefins.svg
              growth_ublue.svg
              growth_nonbazzite.svg
              growth_bazzite.svg
              growth_bazzite_purple.svg
              growth_ucore.svg
              growth_global.svg
              growth_upstream.svg
              growth_upstream_with_bazzite.svg
              badge-endpoints/*.json
            commit-msg: Growth Chart Update ${{ steps.date.outputs.date }}
            github-token: ${{ secrets.GITHUB_TOKEN }}
